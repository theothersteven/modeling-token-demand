[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeling-token-demand"
version = "0.1.0"
description = "A numerical economic model of AI token demand"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
notebook = [
  "jupyterlab>=4",
  "matplotlib>=3.7",
]
dev = ["pytest>=7"]
paper = [
  "matplotlib>=3.7",
  "ipython>=8",
  "mistune>=3.3.4,<4",
  "plotly>=6,<7",
]

[project.scripts]
token-demand-paper = "modeling_token_demand.paper:main"

[tool.setuptools.package-data]
modeling_token_demand = ["paper_assets/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
