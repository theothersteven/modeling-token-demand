<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcf8"/>
      <stop offset="1" stop-color="#f1f5ee"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#91aa96"/>
      <stop offset="1" stop-color="#236652"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#253d33" flood-opacity="0.10"/>
    </filter>
    <clipPath id="plot-clip">
      <rect x="806" y="126" width="286" height="326" rx="2"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="18" height="630" fill="#236652"/>
  <circle cx="1075" cy="62" r="176" fill="#e5ede3" opacity="0.75"/>
  <circle cx="1170" cy="570" r="230" fill="#eef2ea"/>

  <g transform="translate(78 76)">
    <text fill="#236652" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" font-weight="700" letter-spacing="3">INTERACTIVE RESEARCH NOTE</text>
    <line x1="0" y1="28" x2="74" y2="28" stroke="#a9853d" stroke-width="4"/>

    <text x="0" y="126" fill="#253d33" font-family="Georgia, 'Times New Roman', serif"
          font-size="79" font-weight="400" letter-spacing="-2.5">Modeling</text>
    <text x="0" y="211" fill="#253d33" font-family="Georgia, 'Times New Roman', serif"
          font-size="79" font-weight="400" letter-spacing="-2.5">Token Demand</text>

    <text x="3" y="286" fill="#55675b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="500">token demand, jevons paradox,</text>
    <text x="3" y="322" fill="#55675b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="500">the value of human attention</text>

    <text x="3" y="458" fill="#253d33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="19" font-weight="650">Steven Yin</text>
    <text x="3" y="488" fill="#67706b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15">theothersteven.github.io/modeling-token-demand</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="756" y="78" width="384" height="472" rx="14" fill="#ffffff" stroke="#dce1d9"/>
  </g>
  <text x="790" y="116" fill="#236652" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" font-weight="700" letter-spacing="1.8">CAPABILITY × DEMAND</text>

  <g clip-path="url(#plot-clip)">
    <line x1="806" y1="452" x2="1092" y2="452" stroke="#cfd8cf" stroke-width="1.5"/>
    <line x1="806" y1="126" x2="806" y2="452" stroke="#cfd8cf" stroke-width="1.5"/>
    <line x1="806" y1="370" x2="1092" y2="370" stroke="#e8ece6"/>
    <line x1="806" y1="289" x2="1092" y2="289" stroke="#e8ece6"/>
    <line x1="806" y1="207" x2="1092" y2="207" stroke="#e8ece6"/>
    <line x1="877" y1="126" x2="877" y2="452" stroke="#eef1ec"/>
    <line x1="949" y1="126" x2="949" y2="452" stroke="#eef1ec"/>
    <line x1="1021" y1="126" x2="1021" y2="452" stroke="#eef1ec"/>

    <path d="M806 438 C844 434 865 421 887 392 C916 354 920 279 950 232 C980 185 1021 160 1092 148"
          fill="none" stroke="url(#chart)" stroke-width="8" stroke-linecap="round"/>
    <path d="M806 425 C845 398 878 339 913 289 C948 239 980 231 1009 249 C1041 269 1065 315 1092 350"
          fill="none" stroke="#a9853d" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 10"/>
    <path d="M806 406 C852 389 891 357 923 316 C956 275 988 245 1025 211 C1048 190 1070 177 1092 168"
          fill="none" stroke="#517e96" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>

    <circle cx="950" cy="232" r="8" fill="#ffffff" stroke="#236652" stroke-width="4"/>
    <circle cx="913" cy="289" r="7" fill="#ffffff" stroke="#a9853d" stroke-width="3"/>
  </g>

  <text x="806" y="482" fill="#67706b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13">model capability →</text>
  <g transform="translate(790 515)">
    <circle cx="5" cy="-5" r="5" fill="#236652"/>
    <text x="18" fill="#55675b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13">adoption</text>
    <line x1="104" y1="-5" x2="132" y2="-5" stroke="#a9853d" stroke-width="4" stroke-dasharray="8 6"/>
    <text x="143" fill="#55675b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="13">token demand</text>
  </g>
</svg>
